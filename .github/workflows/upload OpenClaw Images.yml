# 简化版：只拉取一个镜像，通过环境变量支持中文
name: Pull OpenClaw Image

on:
  workflow_dispatch:

jobs:
  pull-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Pull OpenClaw (with WebUI + Ollama support)
        run: docker pull coollabsio/openclaw:latest

      - name: Save Docker Image
        run: docker save coollabsio/openclaw:latest -o openclaw.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: openclaw-docker-image
          path: openclaw.tar
